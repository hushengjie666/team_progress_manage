name: timemanage-desktop
options:
  bundleIdPrefix: xyz.hudashuai.timemanage
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
packages:
  TimerActivityModel:
    path: ../../../native/timer-activity-model
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: TimeManage
      PRODUCT_BUNDLE_IDENTIFIER: xyz.hudashuai.timemanage
      DEVELOPMENT_TEAM: 2P3ULGHFM8
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: 0.2.8
      CURRENT_PROJECT_VERSION: 2026081803
      TARGETED_DEVICE_FAMILY: 1
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  timemanage-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: timemanage-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: PrivacyInfo.xcprivacy
    info:
      path: timemanage-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: xyz.hudashuai.timemanage
            CFBundleURLSchemes: [timemanage]
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.2.8
        CFBundleVersion: "2026081803"
    entitlements:
      path: timemanage-desktop_iOS/timemanage-desktop_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - target: TimerLiveActivity
        embed: true
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  TimerLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimerLiveActivity
    info:
      path: TimerLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: TimeManage Timer
        CFBundleShortVersionString: 0.2.8
        CFBundleVersion: "2026081803"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.hudashuai.timemanage.TimerLiveActivity
        DEVELOPMENT_TEAM: 2P3ULGHFM8
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.2.8
        CURRENT_PROJECT_VERSION: 2026081803
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - package: TimerActivityModel
        product: TimerActivityModel
